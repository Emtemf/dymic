<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板配置 - 开发验证工具</title>
    <link href="/css/config.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <h3><i class="fas fa-cog"></i> 模板配置 - 开发验证工具</h3>
            <span class="template-info" id="templateInfo">模板: 未选择 | 版本: 未选择</span>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-outline-primary" onclick="selectTemplate()">
                <i class="fas fa-folder-open"></i> 选择模板
            </button>
            <button class="btn btn-primary" onclick="saveAll()">
                <i class="fas fa-save"></i> 保存全部
            </button>
            <button class="btn btn-success" onclick="preview()">
                <i class="fas fa-eye"></i> 预览
            </button>
            <button class="btn btn-info" onclick="viewData()">
                <i class="fas fa-database"></i> 查看数据
            </button>
        </div>
    </div>

    <!-- 三栏布局容器 -->
    <div class="main-container">
        <!-- 左栏：组件库 -->
        <div class="left-panel">
            <div class="panel-header">
                <i class="fas fa-cubes"></i> 组件库
            </div>
            <div class="panel-content">
                <!-- 基础组件 -->
                <div class="component-group">
                    <div class="group-header">
                        <i class="fas fa-edit"></i> 基础组件
                    </div>
                    <div class="component-list">
                        <div class="component-item" draggable="true" data-type="TEXT_INPUT">
                            <i class="fas fa-font"></i>
                            <span>文本框</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="NUMBER_INPUT">
                            <i class="fas fa-sort-numeric-up"></i>
                            <span>数字框</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="MONEY_INPUT">
                            <i class="fas fa-dollar-sign"></i>
                            <span>金额框</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="DATE_PICKER">
                            <i class="fas fa-calendar"></i>
                            <span>日期选择</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="SELECT">
                            <i class="fas fa-list"></i>
                            <span>下拉框</span>
                        </div>
                    </div>
                </div>

                <!-- 容器组件 -->
                <div class="component-group">
                    <div class="group-header">
                        <i class="fas fa-th-large"></i> 容器组件
                    </div>
                    <div class="component-list">
                        <div class="component-item" draggable="true" data-type="CARD_CONTAINER">
                            <i class="fas fa-square"></i>
                            <span>卡片容器</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="SEPARATOR">
                            <i class="fas fa-minus"></i>
                            <span>分隔线</span>
                        </div>
                    </div>
                </div>

                <!-- 动作组件 -->
                <div class="component-group">
                    <div class="group-header">
                        <i class="fas fa-mouse-pointer"></i> 动作组件
                    </div>
                    <div class="component-list">
                        <div class="component-item" draggable="true" data-type="SAVE_BUTTON">
                            <i class="fas fa-save"></i>
                            <span>保存按钮</span>
                        </div>
                        <div class="component-item" draggable="true" data-type="QUERY_BUTTON">
                            <i class="fas fa-search"></i>
                            <span>查询按钮</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中栏：配置画布 -->
        <div class="center-panel">
            <div class="panel-header">
                <i class="fas fa-object-group"></i> 配置画布
                <button class="btn btn-sm btn-outline-success add-card-btn" onclick="addRootCard()">
                    <i class="fas fa-plus"></i> 添加卡片
                </button>
            </div>
            <div class="panel-content" id="canvas">
                <!-- 节点树将在这里动态渲染 -->
                <div class="canvas-placeholder" id="canvasPlaceholder">
                    <i class="fas fa-plus-circle"></i>
                    <p>点击"添加卡片"或拖拽组件到此处进行配置</p>
                </div>
                <div id="nodeTree"></div>
            </div>
        </div>

        <!-- 右栏：属性面板 -->
        <div class="right-panel">
            <div class="panel-header">
                <i class="fas fa-sliders-h"></i> 属性面板
            </div>
            <div class="panel-content" id="properties-panel">
                <!-- 选中元素的属性将在这里显示 -->
                <div class="properties-placeholder" id="propertiesPlaceholder">
                    <i class="fas fa-mouse-pointer"></i>
                    <p>选择元素查看属性</p>
                </div>
                <div id="propertyForm" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- 模板选择弹窗 -->
    <div class="modal-overlay" id="templateModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-folder-open"></i> 选择模板</h3>
                <button class="modal-close" onclick="closeModal('templateModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>模板列表</label>
                    <select id="templateSelect" class="form-select" onchange="loadTemplateVersions()">
                        <option value="">请选择模板</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>版本列表</label>
                    <select id="versionSelect" class="form-select">
                        <option value="">请选择版本</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('templateModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmTemplate()">确定</button>
            </div>
        </div>
    </div>

    <!-- 数据源选择弹窗 -->
    <div class="modal-overlay" id="dataSourceModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-database"></i> 选择数据源</h3>
                <button class="modal-close" onclick="closeModal('dataSourceModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="data-source-options">
                    <div class="option-group">
                        <h6>IT配置的数据源</h6>
                        <select id="itDataSourceSelect" class="form-select">
                            <option value="">请选择</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <h6>自定义选项（自己输入）</h6>
                        <textarea id="staticOptionsJson" rows="5" placeholder="每行一个选项，格式：value - label"></textarea>
                        <small>示例：CNY - 人民币</small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('dataSourceModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmDataSource()">确定</button>
            </div>
        </div>
    </div>

    <!-- 保存状态提示 -->
    <div class="save-status" id="saveStatus">
        <span class="save-indicator"></span>
        <span class="save-text">已保存</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/config.js"></script>
</body>
</html>
