<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模板可视化设计器</title>
    <link rel="stylesheet" href="css/designer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    /* Template/Version Selector */
    #selectorPanel { display:flex; height:calc(100vh - 48px); }
    .sel-sidebar { width:280px; background:#fff; border-right:1px solid #e0e0e0; display:flex; flex-direction:column; }
    .sel-sidebar-header { padding:16px; border-bottom:1px solid #eee; font-weight:600; font-size:14px; }
    .sel-sidebar-body { flex:1; overflow-y:auto; padding:8px; }
    .sel-item { padding:12px; border-radius:6px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; }
    .sel-item:hover { background:#f5f7fa; }
    .sel-item.sel-active { border-color:#4f46e5; background:#eef2ff; }
    .sel-item-title { font-weight:600; font-size:14px; }
    .sel-item-sub { font-size:12px; color:#888; margin-top:4px; }
    .sel-item-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-top:4px; }
    .sel-badge-green { background:#e8f5e9; color:#2e7d32; }
    .sel-badge-gray { background:#f5f5f5; color:#999; }
    .sel-badge-orange { background:#fff3e0; color:#e65100; }
    .sel-main { flex:1; display:flex; flex-direction:column; }
    .sel-content-header { padding:12px 24px; border-bottom:1px solid #e0e0e0; background:#fff; display:flex; align-items:center; justify-content:space-between; }
    .sel-content-body { flex:1; overflow-y:auto; padding:24px; }
    .sel-empty { text-align:center; padding:20px; color:#aaa; font-size:14px; }
    .sel-empty-state { text-align:center; padding:80px 40px; color:#aaa; }
    .sel-empty-icon { font-size:48px; margin-bottom:16px; }
    .sel-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .sel-detail-card { padding:12px; background:#fff; border:1px solid #eee; border-radius:6px; }
    .sel-detail-label { font-size:12px; color:#888; margin-bottom:4px; }
    .sel-detail-value { font-weight:600; }
    .btn { padding:6px 14px; border-radius:4px; font-size:13px; cursor:pointer; border:1px solid #d0d5dd; background:#fff; color:#344054; }
    .btn:hover { background:#f9fafb; }
    .btn-primary { background:#4f46e5; color:#fff; border-color:#4f46e5; }
    .btn-primary:hover { background:#4338ca; }
    .btn-success { background:#059669; color:#fff; border-color:#059669; }
    .btn-sm { padding:4px 10px; font-size:12px; }
    #designerInfoBar { background:#eef2ff; border:1px solid #c7d2fe; border-radius:6px; padding:8px 16px; font-size:13px; color:#4338ca; margin:8px 16px; display:none; }
    .toolbar .breadcrumb { font-size:13px; color:#aaa; margin-left:12px; }
    .toolbar .breadcrumb span { color:#fff; cursor:pointer; }
    </style>
</head>
<body>
    <!-- Template/Version Selector Panel -->
    <div id="selectorPanel">
        <div class="sel-sidebar">
            <div class="sel-sidebar-header" id="selectorPanelTitle">模板列表</div>
            <div class="sel-sidebar-body" id="selectorList"></div>
        </div>
        <div class="sel-main">
            <div class="sel-content-header" id="selectorContentHeader">
                <span style="font-size:14px;font-weight:600">选择模板</span>
                <div></div>
            </div>
            <div class="sel-content-body" id="selectorContent">
                <div class="sel-empty-state"><div class="sel-empty-icon">📋</div><p>从左侧选择一个模板开始配置</p></div>
            </div>
        </div>
    </div>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <h2><i class="fas fa-paint-brush"></i> 模板设计器</h2>
            <span class="breadcrumb" id="selectorBreadcrumb">模板管理</span>
            <span class="template-name" id="templateName">新建模板</span>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-secondary" onclick="importConfig()">
                <i class="fas fa-file-import"></i> 导入
            </button>
            <button class="btn btn-secondary" onclick="exportConfig()">
                <i class="fas fa-file-export"></i> 导出
            </button>
            <button class="btn btn-primary" onclick="previewTemplate()">
                <i class="fas fa-eye"></i> 预览
            </button>
            <button class="btn btn-success" onclick="saveConfig()">
                <i class="fas fa-save"></i> 保存
            </button>
            <button class="btn btn-warning" onclick="publishTemplate()">
                <i class="fas fa-rocket"></i> 发布
            </button>
        </div>
    </div>

    <!-- Designer Info Bar -->
    <div id="designerInfoBar">
        <span id="designerInfoText"></span>
        <button class="btn btn-sm" onclick="TemplateSelector.goToStep(1)" style="float:right">← 返回模板列表</button>
    </div>

    <!-- Designer Panel (hidden when selector is shown) -->
    <div id="designerPanel" style="display:none">

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧预览区 -->
        <div class="preview-area">
            <div class="preview-header">
                <h3><i class="fas fa-mobile-alt"></i> 预览区</h3>
                <div class="preview-tools">
                    <button class="btn-icon" onclick="zoomIn()" title="放大">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button class="btn-icon" onclick="zoomOut()" title="缩小">
                        <i class="fas fa-search-minus"></i>
                    </button>
                    <button class="btn-icon" onclick="resetZoom()" title="重置">
                        <i class="fas fa-undo"></i>
                    </button>
                </div>
            </div>
            <div class="preview-canvas" id="previewCanvas"
                 ondrop="handleDrop(event)"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)">
                <div class="drop-hint" id="dropHint">
                    <i class="fas fa-plus-circle"></i>
                    <p>从右侧拖拽组件到此处</p>
                </div>
                <div id="previewContent"></div>
            </div>
        </div>

        <!-- 右侧配置面板 -->
        <div class="config-panel">
            <!-- Tab切换 -->
            <div class="config-tabs">
                <button class="tab-btn active" onclick="switchTab('components')">
                    <i class="fas fa-cubes"></i> 组件库
                </button>
                <button class="tab-btn" onclick="switchTab('properties')">
                    <i class="fas fa-cog"></i> 属性配置
                </button>
                <button class="tab-btn" onclick="switchTab('rules')">
                    <i class="fas fa-rule"></i> 规则配置
                </button>
                <button class="tab-btn" onclick="switchTab('data')">
                    <i class="fas fa-database"></i> 数据源
                </button>
            </div>

            <!-- Tab内容 -->
            <div class="tab-contents">
                <!-- 组件库 -->
                <div class="tab-content active" id="componentsTab">
                    <div class="component-category">
                        <div class="category-header">
                            <i class="fas fa-th-large"></i> 布局组件
                        </div>
                        <div class="component-list">
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="PAGE">
                                <i class="fas fa-file"></i>
                                <span>页面</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="CARD">
                                <i class="fas fa-square"></i>
                                <span>卡片</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="GRID">
                                <i class="fas fa-th"></i>
                                <span>栅格</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="TAB">
                                <i class="fas fa-folder"></i>
                                <span>Tab页签</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="COLLAPSE">
                                <i class="fas fa-chevron-down"></i>
                                <span>折叠面板</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="ROW">
                                <i class="fas fa-grip-lines"></i>
                                <span>行</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="COL">
                                <i class="fas fa-grip-lines-vertical"></i>
                                <span>列</span>
                            </div>
                        </div>
                    </div>

                    <div class="component-category">
                        <div class="category-header">
                            <i class="fas fa-edit"></i> 基础组件
                        </div>
                        <div class="component-list">
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="INPUT">
                                <i class="fas fa-font"></i>
                                <span>输入框</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="SELECT">
                                <i class="fas fa-list"></i>
                                <span>下拉框</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="DATE">
                                <i class="fas fa-calendar"></i>
                                <span>日期选择</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="NUMBER">
                                <i class="fas fa-sort-numeric-up"></i>
                                <span>数字输入</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="MONEY">
                                <i class="fas fa-dollar-sign"></i>
                                <span>金额输入</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="TEXTAREA">
                                <i class="fas fa-align-left"></i>
                                <span>多行文本</span>
                            </div>
                        </div>
                    </div>

                    <div class="component-category">
                        <div class="category-header">
                            <i class="fas fa-briefcase"></i> 业务组件
                        </div>
                        <div class="component-list">
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="SUPPLIER_SELECT">
                                <i class="fas fa-building"></i>
                                <span>供应商选择</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="DETAIL_TABLE">
                                <i class="fas fa-table"></i>
                                <span>明细表</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="ATTACHMENT">
                                <i class="fas fa-paperclip"></i>
                                <span>附件上传</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="IMAGE">
                                <i class="fas fa-image"></i>
                                <span>图片上传</span>
                            </div>
                        </div>
                    </div>

                    <div class="component-category">
                        <div class="category-header">
                            <i class="fas fa-mouse-pointer"></i> 动作组件
                        </div>
                        <div class="component-list">
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="BUTTON">
                                <i class="fas fa-hand-pointer"></i>
                                <span>按钮</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="QUERY_DIALOG">
                                <i class="fas fa-search"></i>
                                <span>查询弹窗</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="SAVE_BUTTON">
                                <i class="fas fa-save"></i>
                                <span>保存按钮</span>
                            </div>
                            <div class="component-item" draggable="true"
                                 ondragstart="handleDragStart(event)"
                                 data-type="SUBMIT_BUTTON">
                                <i class="fas fa-check"></i>
                                <span>提交按钮</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 属性配置 -->
                <div class="tab-content" id="propertiesTab">
                    <div class="empty-state" id="emptyPropertyState">
                        <i class="fas fa-mouse-pointer"></i>
                        <p>请选择预览区的组件进行配置</p>
                    </div>
                    <div class="property-form" id="propertyForm" style="display:none;">
                        <!-- 基本信息配置 -->
                        <div class="property-section">
                            <h4><i class="fas fa-info-circle"></i> 基本信息</h4>
                            <div class="form-group">
                                <label>名称</label>
                                <input type="text" id="propName" onchange="updateProperty('name', this.value)">
                            </div>
                            <div class="form-group">
                                <label>编码</label>
                                <input type="text" id="propCode" onchange="updateProperty('code', this.value)">
                            </div>
                            <div class="form-group">
                                <label>描述</label>
                                <textarea id="propDescription" rows="2"
                                          onchange="updateProperty('description', this.value)"></textarea>
                            </div>
                        </div>

                        <!-- 样式配置 -->
                        <div class="property-section">
                            <h4><i class="fas fa-palette"></i> 样式配置</h4>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>宽度</label>
                                    <input type="text" id="propWidth" placeholder="如: 100%, 200px"
                                           onchange="updateProperty('width', this.value)">
                                </div>
                                <div class="form-group">
                                    <label>高度</label>
                                    <input type="text" id="propHeight" placeholder="如: auto, 300px"
                                           onchange="updateProperty('height', this.value)">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>栅格列数</label>
                                    <select id="propSpan" onchange="updateProperty('span', this.value)">
                                        <option value="24">24列(整行)</option>
                                        <option value="12">12列(半行)</option>
                                        <option value="8">8列(1/3行)</option>
                                        <option value="6">6列(1/4行)</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>偏移量</label>
                                    <input type="number" id="propOffset" min="0" max="24"
                                           onchange="updateProperty('offset', this.value)">
                                </div>
                            </div>
                        </div>

                        <!-- 数据绑定 -->
                        <div class="property-section" id="dataBindingSection">
                            <h4><i class="fas fa-link"></i> 数据绑定</h4>
                            <div class="form-group">
                                <label>字段路径</label>
                                <input type="text" id="propFieldPath" placeholder="如: supplier.name"
                                       onchange="updateProperty('fieldPath', this.value)">
                            </div>
                            <div class="form-group">
                                <label>数据类型</label>
                                <select id="propDataType" onchange="updateProperty('dataType', this.value)">
                                    <option value="string">文本</option>
                                    <option value="number">数字</option>
                                    <option value="date">日期</option>
                                    <option value="boolean">布尔</option>
                                    <option value="object">对象</option>
                                    <option value="array">数组</option>
                                </select>
                            </div>
                        </div>

                        <!-- 组件特有配置 -->
                        <div class="property-section" id="componentSpecificSection">
                            <h4><i class="fas fa-cogs"></i> 组件配置</h4>
                            <div id="componentSpecificConfig"></div>
                        </div>

                        <!-- 删除按钮 -->
                        <div class="property-actions">
                            <button class="btn btn-danger" onclick="deleteSelectedComponent()">
                                <i class="fas fa-trash"></i> 删除组件
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 规则配置 -->
                <div class="tab-content" id="rulesTab">
                    <div class="empty-state" id="emptyRuleState">
                        <i class="fas fa-shield-alt"></i>
                        <p>请选择组件配置规则</p>
                    </div>
                    <div class="rule-form" id="ruleForm" style="display:none;">
                        <!-- 可见性规则 -->
                        <div class="rule-section">
                            <h4><i class="fas fa-eye"></i> 可见性规则</h4>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="enableVisibility"
                                           onchange="toggleRuleSection('visibility', this.checked)">
                                    启用可见性规则
                                </label>
                            </div>
                            <div class="rule-config" id="visibilityConfig" style="display:none;">
                                <div class="form-group">
                                    <label>条件表达式</label>
                                    <input type="text" id="visibilityExpr"
                                           placeholder="如: status === 'approved'"
                                           onchange="updateRule('visibility', 'expression', this.value)">
                                </div>
                                <button class="btn btn-sm btn-secondary" onclick="testExpression('visibility')">
                                    <i class="fas fa-play"></i> 测试表达式
                                </button>
                            </div>
                        </div>

                        <!-- 必填规则 -->
                        <div class="rule-section">
                            <h4><i class="fas fa-asterisk"></i> 必填规则</h4>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="enableRequired"
                                           onchange="toggleRuleSection('required', this.checked)">
                                    启用动态必填
                                </label>
                            </div>
                            <div class="rule-config" id="requiredConfig" style="display:none;">
                                <div class="form-group">
                                    <label>条件表达式</label>
                                    <input type="text" id="requiredExpr"
                                           placeholder="如: amount > 10000"
                                           onchange="updateRule('required', 'expression', this.value)">
                                </div>
                                <button class="btn btn-sm btn-secondary" onclick="testExpression('required')">
                                    <i class="fas fa-play"></i> 测试表达式
                                </button>
                            </div>
                        </div>

                        <!-- 只读规则 -->
                        <div class="rule-section">
                            <h4><i class="fas fa-lock"></i> 只读规则</h4>
                            <div class="form-group">
                                <label>
                                    <input type="checkbox" id="enableReadonly"
                                           onchange="toggleRuleSection('readonly', this.checked)">
                                    启用动态只读
                                </label>
                            </div>
                            <div class="rule-config" id="readonlyConfig" style="display:none;">
                                <div class="form-group">
                                    <label>条件表达式</label>
                                    <input type="text" id="readonlyExpr"
                                           placeholder="如: status !== 'draft'"
                                           onchange="updateRule('readonly', 'expression', this.value)">
                                </div>
                                <button class="btn btn-sm btn-secondary" onclick="testExpression('readonly')">
                                    <i class="fas fa-play"></i> 测试表达式
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 数据源配置 -->
                <div class="tab-content" id="dataTab">
                    <div class="data-source-section">
                        <div class="section-header">
                            <h4><i class="fas fa-database"></i> 数据源绑定</h4>
                            <button class="btn btn-sm btn-primary" onclick="addDataSource()">
                                <i class="fas fa-plus"></i> 添加数据源
                            </button>
                        </div>
                        <div id="dataSourcesList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div class="modal" id="previewModal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3><i class="fas fa-eye"></i> 模板预览</h3>
                <button class="close-btn" onclick="closeModal('previewModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="previewModalContent" style="width:100%;max-height:70vh;overflow-y:auto;padding:20px;background:#f5f7fa;border-radius:4px;"></div>
            </div>
        </div>
    </div>

    <!-- 数据源选择弹窗 -->
    <div class="modal" id="dataSourceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-database"></i> 选择数据源</h3>
                <button class="close-btn" onclick="closeModal('dataSourceModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>数据源类型</label>
                    <select id="dataSourceType" onchange="loadDataSourceOptions()">
                        <option value="">请选择</option>
                        <option value="STATIC">静态数据</option>
                        <option value="DICT">字典</option>
                        <option value="HTTP">HTTP接口</option>
                        <option value="PLATFORM">平台服务</option>
                        <option value="INTERNAL">内部服务</option>
                    </select>
                </div>
                <div id="dataSourceConfig"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('dataSourceModal')">取消</button>
                <button class="btn btn-primary" onclick="confirmDataSource()">确定</button>
            </div>
        </div>
    </div>

    <!-- 加载JavaScript文件 -->
    <script src="js/component-library.js"></script>
    <script src="js/drag-drop.js"></script>
    <script src="js/preview-renderer.js"></script>
    <script src="js/property-panel.js"></script>
    <script src="js/config-api.js"></script>
    <script src="js/template-selector.js"></script>
    <script src="js/designer.js"></script>
    <script src="js/detail-table.js"></script>

    <!-- Detail row edit modal -->
    <div id="detailRowModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10000;align-items:center;justify-content:center;">
        <div style="background:white;border-radius:8px;width:480px;max-height:80vh;overflow:auto;">
            <div style="padding:16px 20px;border-bottom:1px solid #e1e4e8;font-weight:600;font-size:16px;">
                编辑明细行
                <button onclick="DetailTableHelper.closeModal()" style="float:right;border:none;background:none;font-size:20px;cursor:pointer;color:#999;">&times;</button>
            </div>
            <div id="detailRowModalBody" style="padding:20px;">
            </div>
            <div style="padding:12px 20px;border-top:1px solid #e1e4e8;text-align:right;">
                <button onclick="DetailTableHelper.closeModal()" style="padding:6px 16px;border:1px solid #d1d5da;background:white;border-radius:4px;cursor:pointer;margin-right:8px;">取消</button>
