<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预览界面 - 开发验证工具</title>
    <link href="/css/preview.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部信息栏 -->
    <div class="preview-header">
        <div class="header-content">
            <h3 class="header-title">预览界面 - 开发验证工具</h3>
            <div class="template-info">
                <span class="info-item">
                    模板: <strong id="templateName">加载中...</strong>
                </span>
                <span class="info-item">
                    版本: <strong id="versionNumber">加载中...</strong>
                </span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline-secondary" onclick="window.location.href='/config.html'">
                返回配置
            </button>
            <button class="btn btn-outline-info" onclick="window.location.href='/data-viewer.html'">
                查看数据
            </button>
        </div>
    </div>

    <!-- 预览表单区域 -->
    <div class="preview-container">
        <!-- 左侧：动态渲染的表单 -->
        <div class="form-panel">
            <div class="form-container" id="formContainer">
                <!-- Schema API渲染的表单将在这里显示 -->
                <div class="loading-spinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="loading-text">正在加载配置...</p>
                </div>
            </div>

            <!-- 底部操作按钮 -->
            <div class="form-actions" id="formActions">
                <button class="btn btn-success" onclick="renderer.saveFormData()">
                    <i class="icon-save"></i> 保存数据
                </button>
                <button class="btn btn-outline-primary" onclick="renderer.resetForm()">
                    <i class="icon-reset"></i> 重置表单
                </button>
            </div>
        </div>

        <!-- 右侧：数据面板 -->
        <div class="data-panel">
            <div class="panel-header">
                <h5>当前表单数据</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="renderer.copyFormData()">
                    复制JSON
                </button>
            </div>
            <div class="panel-body">
                <pre id="formDataJson">{}</pre>
            </div>

            <!-- Schema信息面板 -->
            <div class="schema-info-panel">
                <div class="panel-header">
                    <h5>Schema结构信息</h5>
                </div>
                <div class="panel-body">
                    <div id="schemaInfo">
                        <div class="info-row">
                            <span class="info-label">节点总数:</span>
                            <span id="totalNodes">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">字段总数:</span>
                            <span id="totalFields">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">组件总数:</span>
                            <span id="totalComponents">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">动作总数:</span>
                            <span id="totalActions">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 错误提示模态框 -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">错误提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 引入preview.js -->
    <script src="/js/preview.js"></script>
</body>
</html>
