<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单界面 - 合同模板 Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav flex justify-between items-center">
    <a href="index.html" class="nav-brand">合同模板系统</a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">首页</a></li>
      <li><a href="simple.html" class="nav-link active">简单界面</a></li>
      <li><a href="complex.html" class="nav-link">复杂界面</a></li>
    </ul>
  </nav>

  <div class="container">
    <!-- Page Header -->
    <div class="card">
      <div class="flex justify-between items-center">
        <div>
          <h1 style="font-size: 24px; margin-bottom: 8px;">采购合同 - 简单界面</h1>
          <p style="color: var(--text-secondary); font-size: 14px;">
            单页卡片表单，包含合同基本信息
          </p>
        </div>
        <div>
          <span id="contractStatus" class="badge badge-warning">草稿</span>
        </div>
      </div>
    </div>

    <!-- Contract Form -->
    <div class="card">
      <div class="card-header">基本信息</div>
      <div class="card-body">
        <div id="formAlert" class="alert hidden"></div>

        <form id="contractForm">
          <!-- Contract Number and Name -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="contractNumber">合同编号 *</label>
              <input
                type="text"
                id="contractNumber"
                class="form-input"
                placeholder="例如：PO-2024-001"
                required
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="contractName">合同名称 *</label>
              <input
                type="text"
                id="contractName"
                class="form-input"
                placeholder="例如：办公用品采购合同"
                required
              >
            </div>
          </div>

          <!-- Contract Type and Supplier -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="contractType">合同类型 *</label>
              <select id="contractType" class="form-select" required>
                <option value="">请选择</option>
                <option value="采购合同">采购合同</option>
                <option value="销售合同">销售合同</option>
                <option value="服务合同">服务合同</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="supplierName">供应商 *</label>
              <div class="flex gap-sm">
                <input
                  type="text"
                  id="supplierName"
                  class="form-input"
                  placeholder="请选择供应商"
                  readonly
                  required
                >
                <button
                  type="button"
                  id="selectSupplierBtn"
                  class="btn btn-secondary"
                >
                  选择
                </button>
              </div>
              <input type="hidden" id="supplierId">
            </div>
          </div>

          <!-- Currency and Amount -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="currency">币种 *</label>
              <select id="currency" class="form-select" required>
                <option value="CNY">人民币 (CNY)</option>
                <option value="USD">美元 (USD)</option>
                <option value="EUR">欧元 (EUR)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="amount">合同金额 *</label>
              <input
                type="number"
                id="amount"
                class="form-input"
                placeholder="请输入金额"
                min="0"
                step="0.01"
                required
              >
            </div>
          </div>

          <!-- Signing Date and Effective Date -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="signingDate">签订日期</label>
              <input
                type="date"
                id="signingDate"
                class="form-input"
              >
            </div>

            <div class="form-group">
              <label class="form-label" for="effectiveDate">生效日期</label>
              <input
                type="date"
                id="effectiveDate"
                class="form-input"
              >
            </div>
          </div>

          <!-- Contract Description -->
          <div class="form-group">
            <label class="form-label" for="description">合同描述</label>
            <textarea
              id="description"
              class="form-textarea"
              placeholder="请输入合同描述"
              rows="3"
            ></textarea>
          </div>

          <!-- Action Buttons -->
          <div class="flex justify-between mt-lg">
            <div class="flex gap-sm">
              <button type="submit" class="btn btn-primary">
                保存合同
              </button>
              <button type="button" id="submitContractBtn" class="btn btn-secondary">
                提交审批
              </button>
            </div>
            <button type="button" id="resetFormBtn" class="btn btn-secondary">
              重置
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Saved Contracts List -->
    <div class="card">
      <div class="card-header">已保存的合同</div>
      <div class="card-body">
        <div id="contractsList">
          <p style="color: var(--text-secondary); text-align: center;">
            暂无保存的合同
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Supplier Selection Modal -->
  <div id="supplierModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">选择供应商</h3>
        <button class="modal-close" id="closeSupplierModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <input
            type="text"
            id="supplierSearch"
            class="form-input"
            placeholder="输入供应商名称搜索..."
          >
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>供应商编码</th>
                <th>供应商名称</th>
                <th>联系人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="supplierTableBody">
              <tr>
                <td colspan="4" style="text-align: center; color: var(--text-secondary);">
                  请输入关键词搜索
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSupplierBtn">取消</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div class="loading-text">处理中...</div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/contract-api.js"></script>
  <script>
    // State Management
    let savedContracts = [];

    // DOM Elements
    const contractForm = document.getElementById('contractForm');
    const formAlert = document.getElementById('formAlert');
    const selectSupplierBtn = document.getElementById('selectSupplierBtn');
    const supplierModal = document.getElementById('supplierModal');
    const closeSupplierModal = document.getElementById('closeSupplierModal');
    const cancelSupplierBtn = document.getElementById('cancelSupplierBtn');
    const supplierSearch = document.getElementById('supplierSearch');
    const supplierTableBody = document.getElementById('supplierTableBody');
    const submitContractBtn = document.getElementById('submitContractBtn');
    const resetFormBtn = document.getElementById('resetFormBtn');
    const contractsList = document.getElementById('contractsList');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // Utility Functions
    function showLoading() {
      loadingOverlay.classList.remove('hidden');
    }

    function hideLoading() {
      loadingOverlay.classList.add('hidden');
    }

    function showAlert(message, type = 'info') {
      formAlert.className = `alert alert-${type}`;
      formAlert.textContent = message;
      formAlert.classList.remove('hidden');

      setTimeout(() => {
        formAlert.classList.add('hidden');
      }, 5000);
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('zh-CN');
    }

    // Supplier Modal Functions
    function openSupplierModal() {
      supplierModal.classList.add('active');
      supplierSearch.focus();
    }

    function closeSupplierModalFn() {
      supplierModal.classList.remove('active');
      supplierSearch.value = '';
      supplierTableBody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align: center; color: var(--text-secondary);">
            请输入关键词搜索
          </td>
        </tr>
      `;
    }

    // Mock Supplier Search (simulates API call)
    async function searchSuppliers(keyword) {
      // Simulated delay
      await new Promise(resolve => setTimeout(resolve, 500));

      // Mock data
      const mockSuppliers = [
        { id: 'SUP001', code: 'SUP-001', name: '北京科技有限公司', contact: '张三' },
        { id: 'SUP002', code: 'SUP-002', name: '上海贸易公司', contact: '李四' },
        { id: 'SUP003', code: 'SUP-003', name: '广州制造企业', contact: '王五' },
        { id: 'SUP004', code: 'SUP-004', name: '深圳电子商务公司', contact: '赵六' },
        { id: 'SUP005', code: 'SUP-005', name: '杭州网络科技公司', contact: '孙七' }
      ];

      return mockSuppliers.filter(s =>
        s.name.includes(keyword) || s.code.includes(keyword)
      );
    }

    // Supplier Search Handler
    let searchTimeout;
    supplierSearch.addEventListener('input', async (e) => {
      const keyword = e.target.value.trim();

      clearTimeout(searchTimeout);

      if (!keyword) {
        supplierTableBody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-secondary);">
              请输入关键词搜索
            </td>
          </tr>
        `;
        return;
      }

      searchTimeout = setTimeout(async () => {
        showLoading();
        try {
          const suppliers = await searchSuppliers(keyword);
          hideLoading();

          if (suppliers.length === 0) {
            supplierTableBody.innerHTML = `
              <tr>
                <td colspan="4" style="text-align: center; color: var(--text-secondary);">
                  未找到匹配的供应商
                </td>
              </tr>
            `;
          } else {
            supplierTableBody.innerHTML = suppliers.map(supplier => `
              <tr>
                <td>${supplier.code}</td>
                <td>${supplier.name}</td>
                <td>${supplier.contact}</td>
                <td>
                  <button
                    type="button"
                    class="btn btn-sm btn-primary"
                    onclick="selectSupplier('${supplier.id}', '${supplier.name}')"
                  >
                    选择
                  </button>
                </td>
              </tr>
            `).join('');
          }
        } catch (error) {
          hideLoading();
          supplierTableBody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; color: var(--error-color);">
                搜索失败: ${error.message}
              </td>
            </tr>
          `;
        }
      }, 500);
    });

    // Select Supplier Function
    window.selectSupplier = function(id, name) {
      document.getElementById('supplierId').value = id;
      document.getElementById('supplierName').value = name;
      closeSupplierModalFn();
    };

    // Modal Event Handlers
    selectSupplierBtn.addEventListener('click', openSupplierModal);
    closeSupplierModal.addEventListener('click', closeSupplierModalFn);
    cancelSupplierBtn.addEventListener('click', closeSupplierModalFn);

    // Close modal on outside click
    supplierModal.addEventListener('click', (e) => {
      if (e.target === supplierModal) {
        closeSupplierModalFn();
      }
    });

    // Form Submit Handler
    contractForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const contractData = {
        contractNumber: document.getElementById('contractNumber').value.trim(),
        contractName: document.getElementById('contractName').value.trim(),
        contractType: document.getElementById('contractType').value,
        supplierId: document.getElementById('supplierId').value,
        supplierName: document.getElementById('supplierName').value,
        currency: document.getElementById('currency').value,
        amount: parseFloat(document.getElementById('amount').value),
        signingDate: document.getElementById('signingDate').value,
        effectiveDate: document.getElementById('effectiveDate').value,
        description: document.getElementById('description').value.trim(),
        status: 'DRAFT',
        createdAt: new Date().toISOString()
      };

      showLoading();

      try {
        // In real scenario, this would call the API
        // const result = await ContractAPI.contract.create(contractData);

        // For demo, simulate API call
        await new Promise(resolve => setTimeout(resolve, 1000));

        hideLoading();

        // Add to saved contracts
        savedContracts.push({
          ...contractData,
          id: `CONTRACT-${Date.now()}`
        });

        // Update contracts list
        updateContractsList();

        showAlert('合同保存成功！', 'success');

        // Reset form
        contractForm.reset();
      } catch (error) {
        hideLoading();
        showAlert(`保存失败: ${error.message}`, 'error');
      }
    });

    // Submit Contract Handler
    submitContractBtn.addEventListener('click', async () => {
      const contractNumber = document.getElementById('contractNumber').value.trim();
      const contractName = document.getElementById('contractName').value.trim();

      if (!contractNumber || !contractName) {
        showAlert('请先填写合同信息并保存', 'warning');
        return;
      }

      showLoading();

      try {
        // Simulate submit
        await new Promise(resolve => setTimeout(resolve, 1000));

        hideLoading();
        showAlert('合同已提交审批！', 'success');
        document.getElementById('contractStatus').className = 'badge badge-info';
        document.getElementById('contractStatus').textContent = '待审批';
      } catch (error) {
        hideLoading();
        showAlert(`提交失败: ${error.message}`, 'error');
      }
    });

    // Reset Form Handler
    resetFormBtn.addEventListener('click', () => {
      if (confirm('确定要重置表单吗？未保存的数据将丢失。')) {
        contractForm.reset();
        document.getElementById('contractStatus').className = 'badge badge-warning';
        document.getElementById('contractStatus').textContent = '草稿';
      }
    });

    // Update Contracts List
    function updateContractsList() {
      if (savedContracts.length === 0) {
        contractsList.innerHTML = `
          <p style="color: var(--text-secondary); text-align: center;">
            暂无保存的合同
          </p>
        `;
        return;
      }

      const html = savedContracts.map(contract => `
        <div class="card" style="margin-bottom: 16px;">
          <div class="flex justify-between items-center">
            <div>
              <h3 style="font-size: 16px; margin-bottom: 4px;">${contract.contractName}</h3>
              <p style="color: var(--text-secondary); font-size: 14px;">
                编号: ${contract.contractNumber} | 供应商: ${contract.supplierName}
              </p>
              <p style="color: var(--text-secondary); font-size: 12px; margin-top: 4px;">
                创建时间: ${formatDate(contract.createdAt)}
              </p>
            </div>
            <div class="flex gap-sm">
              <span class="badge badge-${contract.status === 'DRAFT' ? 'warning' : 'info'}">
                ${contract.status === 'DRAFT' ? '草稿' : '待审批'}
              </span>
              <button class="btn btn-sm btn-secondary" onclick="viewContract('${contract.id}')">
                查看
              </button>
            </div>
          </div>
        </div>
      `).join('');

      contractsList.innerHTML = html;
    }

    // View Contract Function
    window.viewContract = function(contractId) {
      const contract = savedContracts.find(c => c.id === contractId);
      if (contract) {
        alert(`合同详情:\n\n编号: ${contract.contractNumber}\n名称: ${contract.contractName}\n类型: ${contract.contractType}\n供应商: ${contract.supplierName}\n金额: ${contract.currency} ${contract.amount}\n状态: ${contract.status}`);
      }
    };

    // Initialize
    updateContractsList();
  </script>
</body>
</html>
