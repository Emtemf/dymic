<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据验证 - 开发验证工具</title>
    <link href="/css/data-viewer.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <h3>数据验证 - 开发验证工具</h3>
            <span class="template-info" id="templateInfo">模板ID: - | 版本ID: -</span>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-primary" onclick="refreshData()">刷新数据</button>
            <button class="btn btn-secondary" onclick="window.location.href='/config.html'">返回配置</button>
            <button class="btn btn-info" onclick="window.location.href='/preview.html'">预览界面</button>
        </div>
    </div>

    <!-- 三列数据展示 -->
    <div class="data-container">
        <!-- 第一列：LayoutNode数据 -->
        <div class="data-column">
            <div class="column-header layout-header">
                <h5>布局节点数据</h5>
                <span class="count-badge" id="layoutNodeCount">0</span>
            </div>
            <div class="column-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>节点编码</th>
                            <th>节点名称</th>
                            <th>节点类型</th>
                            <th>节点路径</th>
                            <th>父节点ID</th>
                            <th>排序号</th>
                        </tr>
                    </thead>
                    <tbody id="layoutNodesTable">
                        <!-- LayoutNode数据将在这里动态填充 -->
                        <tr class="loading-row">
                            <td colspan="7" class="text-center">
                                <span class="loading-spinner"></span> 加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 第二列：FieldDef数据 -->
        <div class="data-column">
            <div class="column-header field-header">
                <h5>字段定义数据</h5>
                <span class="count-badge" id="fieldDefCount">0</span>
            </div>
            <div class="column-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>字段编码</th>
                            <th>字段名称</th>
                            <th>数据类型</th>
                            <th>字段路径</th>
                            <th>布局节点ID</th>
                        </tr>
                    </thead>
                    <tbody id="fieldDefsTable">
                        <!-- FieldDef数据将在这里动态填充 -->
                        <tr class="loading-row">
                            <td colspan="6" class="text-center">
                                <span class="loading-spinner"></span> 加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 第三列：FieldComponent数据 -->
        <div class="data-column">
            <div class="column-header component-header">
                <h5>字段组件数据</h5>
                <span class="count-badge" id="fieldComponentCount">0</span>
            </div>
            <div class="column-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>组件类型</th>
                            <th>显示名称</th>
                            <th>布局节点ID</th>
                            <th>字段定义ID</th>
                            <th>数据源ID</th>
                            <th>排序号</th>
                        </tr>
                    </thead>
                    <tbody id="fieldComponentsTable">
                        <!-- FieldComponent数据将在这里动态填充 -->
                        <tr class="loading-row">
                            <td colspan="7" class="text-center">
                                <span class="loading-spinner"></span> 加载中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 数据统计面板 -->
    <div class="stats-panel">
        <div class="stat-item">
            <span class="stat-label">节点总数:</span>
            <span class="stat-value" id="totalNodes">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">字段总数:</span>
            <span class="stat-value" id="totalFields">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">组件总数:</span>
            <span class="stat-value" id="totalComponents">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">数据完整性:</span>
            <span class="stat-value" id="dataIntegrity">验证中...</span>
        </div>
    </div>

    <!-- 提示消息容器 -->
    <div class="message-container" id="messageContainer"></div>

    <!-- 验证问题模态框 -->
    <div class="validation-modal" id="validationModal" style="display: none;">
        <div class="modal-content">
            <h5>数据完整性验证问题</h5>
            <ul class="issue-list" id="issueList"></ul>
            <button class="btn btn-secondary" onclick="closeValidationModal()">关闭</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/data-viewer.js"></script>
</body>
</html>
